services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=nextjs_user
      - POSTGRES_PASSWORD=nextjs_password
      - POSTGRES_DB=parking_dash
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: